<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Snote · 운영자</title>
  <link rel="icon" href="assets/snote-logo.png">
  <link rel="stylesheet" href="assets/operator-console.css?v=2.87">
  <script src="assets/money.js?v=2.85" defer></script>
  <script src="assets/access-tracker.js?v=2.85" defer></script>
  <script src="assets/operator-console.js?v=2.118" defer></script>
</head>
<body>
  <section id="operator-login" class="login-shell" aria-labelledby="login-title">
    <a class="wordmark" href="./index.html" aria-label="Snote로 돌아가기"><span>S</span> NOTE</a>
    <div class="login-card">
      <span class="eyebrow">SNOTE OPERATOR</span>
      <h1 id="login-title">운영자 로그인</h1>
      <p class="muted">서비스 운영자 전용 관리 공간입니다.</p>
      <form id="operator-login-form">
        <label>이메일<input id="operator-email" type="email" autocomplete="username" maxlength="254" required></label>
        <label>비밀번호<input id="operator-password" type="password" autocomplete="current-password" required></label>
        <label class="remember"><input id="operator-remember" type="checkbox">자동 로그인 유지</label>
        <button class="primary" id="operator-signin" type="submit">로그인</button>
      </form>
      <p id="operator-login-message" class="message" role="status" aria-live="polite">연결을 준비하고 있습니다.</p>
      <a class="back-link" href="./index.html">Snote로 돌아가기</a>
    </div>
  </section>

  <div id="operator-app" class="operator-app" hidden>
    <aside class="sidebar">
      <a class="wordmark" href="./index.html" aria-label="Snote로 돌아가기"><span>S</span> NOTE</a>
      <span class="sidebar-label">운영자</span>
      <nav id="operator-navigation" aria-label="운영자 메뉴">
        <button type="button" data-view="vehicles" aria-current="page"><span data-icon="car"></span><span>모든차량DB</span></button>
        <button type="button" data-view="accounts"><span data-icon="users"></span><span>계정관리</span></button>
        <button type="button" data-view="access"><span data-icon="activity"></span><span>접속관리</span></button>
        <button type="button" data-view="support"><span data-icon="chat"></span><span>챗봇 메세지</span><span id="operator-support-badge" class="support-unread-badge" aria-live="polite" hidden></span></button>
      </nav>
      <a class="sidebar-back" href="./index.html">Snote로 돌아가기</a>
    </aside>
    <div class="workspace">
      <header class="topbar"><div><span class="eyebrow">OPERATOR CONSOLE</span><h1 id="operator-page-title">모든차량DB</h1></div><div class="operator-identity"><span id="operator-actor"></span><button class="icon-button" id="operator-signout" type="button" aria-label="운영자 로그아웃" data-tooltip="로그아웃" data-icon="logout"></button></div></header>
      <main id="operator-main">
        <section id="operator-recovery" class="inline-alert" hidden><span id="operator-recovery-copy"></span><button id="operator-recovery-clean" type="button" class="text-button">임시 작업 정리</button></section>
        <div class="list-panel">
          <div class="list-toolbar">
            <div id="operator-tabs" class="tabs" role="tablist" aria-label="목록 구분"></div>
            <form id="operator-search-form" class="search-field" role="search"><span data-icon="search" aria-hidden="true"></span><input id="operator-search" type="search" aria-label="통합 검색" placeholder="차량번호, 차명, 상사, 담당자 검색" autocomplete="off"><button class="icon-button" type="submit" aria-label="검색" data-tooltip="검색" data-icon="arrow"></button></form>
            <button id="operator-refresh" class="icon-button" type="button" aria-label="목록 새로고침" data-tooltip="새로고침" data-icon="refresh"></button>
          </div>
          <div id="operator-filters" class="filters"></div>
          <div class="list-meta"><span id="operator-count"></span><p id="operator-note" class="muted"></p></div>
          <p id="operator-message" class="message" role="status" aria-live="polite"></p>
          <div id="operator-table-wrap" class="table-wrap" tabindex="0" aria-label="운영 자료 목록"><table id="operator-table"><thead></thead><tbody></tbody></table></div>
          <div id="operator-empty" class="empty" hidden>조회된 자료가 없습니다.</div>
          <nav id="operator-pagination" class="pagination" aria-label="목록 페이지"></nav>
        </div>
      </main>
    </div>
  </div>

  <div id="operator-drawer" class="drawer-overlay" role="dialog" aria-modal="true" aria-labelledby="operator-drawer-title" hidden>
    <section class="drawer-panel" tabindex="-1"><header class="drawer-header"><button class="icon-button close-button" id="operator-drawer-close" type="button" aria-label="상세 닫기" data-tooltip="닫기" data-icon="close"></button><div><span class="eyebrow" id="operator-drawer-kicker"></span><h2 id="operator-drawer-title">상세 정보</h2></div><div id="operator-drawer-actions" class="drawer-actions"></div></header><div id="operator-drawer-body" class="drawer-body"></div><p id="operator-drawer-message" class="message drawer-message" role="status" aria-live="polite"></p></section>
  </div>
  <div id="operator-confirm" class="confirm-overlay" role="alertdialog" aria-modal="true" aria-labelledby="operator-confirm-title" aria-describedby="operator-confirm-copy" hidden><section class="confirm-panel"><h2 id="operator-confirm-title"></h2><p id="operator-confirm-copy"></p><div><button type="button" id="operator-confirm-cancel" class="secondary">취소</button><button type="button" id="operator-confirm-accept" class="primary">확인</button></div></section></div>
  <div id="operator-tooltip" role="tooltip" hidden></div>
</body>
</html>
